name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: HY320-Launcher

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renomear APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk HY320-Launcher.apk
          cp phone/build/outputs/apk/release/phone-release.apk HY-Controle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HY320-Launcher
          path: |
            HY320-Launcher/HY320-Launcher.apk
            HY320-Launcher/HY-Controle.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HY Home 1.0.${{ github.run_number }}
          files: |
            HY320-Launcher/HY320-Launcher.apk
            HY320-Launcher/HY-Controle.apk
          make_latest: true
